<ion-header class="bg-white shadow-none border-b border-gray-200">
  <div class="flex gap-2 items-center mx-3 my-2">
    <img 
      class="max-h-14 mx-auto"
      alt="logo PetPalooza" 
      src="assets/img/logo/PetPalooza.png" 
    />
  </div>
</ion-header>

<ion-content [fullscreen]="true" class="relative bg-gray-50 h-full">
  <div class="flex flex-row items-center">
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/"></ion-back-button>
      </ion-buttons>
      <div class=" w-full rounded-[20px] px-8 pt-4 text-center text-gray-100">
        <h1 class="pb-2 text-3xl font-semibold tracking-widest">🧠 Pon aprueba tus conocimientos </h1>
        <!-- <span class="bg-blue-400 mx-auto mb-4 inline-block h-1 w-[90px] rounded"></span> -->
        <small class="text-sm text-center tracking-widest">Responde nuestra trivia</small>

      </div>
    </div>
  <div class="absolute inset-0 -z-10 bg-gradient-to-br from-purple-500 via-pink-400 to-yellow-400 opacity-40 blur-md"></div>

  <section class="max-w-5xl w-full mx-auto overflow-hidden max-w-4xl min-h-96 h-full mt-6 bg-white/40 backdrop-blur-md rounded-2xl shadow-xl p-2 transition-all duration-300 relative">    
      <!-- Skeleton de carga -->
      <div *ngIf="isLoading" class="space-y-4 p-4 animate-pulse" >
        <!-- <div class="w-full h-72 bg-gray-300 rounded"></div> -->
        <div class="mt-6 flex flex-row justify-between items-center">
          <p class="w-36 h-10 text-center text-sm p-2 px-3 rounded-full bg-gray-300">
            
          </p>
        </div>
        <div class="h-16 w-3/4 bg-gray-300 mx-auto rounded"></div>
        <div class="grid grid-cols-2 gap-2">
          <div class="h-20 bg-gray-300 rounded-md"></div>
          <div class="h-20 bg-gray-300 rounded-md"></div>
          <div class="h-20 bg-gray-300 rounded-md"></div>
          <div class="h-20 bg-gray-300 rounded-md"></div>
        </div>
        <div class="px-4 py-2">
          <div class="relative w-full h-6 bg-gray-300 rounded-full overflow-hidden"> 
            <div 
              class="h-full flex items-center justify-center">   
            </div>
          </div>
        </div>
      </div>
      <!-- End Skeleton de carga -->

      <div *ngIf="currentQuestion" class="question-container py-4 px-2 mt-8" [ngClass]="{'fade-in': animate}" >
        <div class="mb-4 flex flex-row justify-between items-center">
          <p class="text-center text-sm p-2 px-3 text-gray-50 rounded-full bg-orange-500">
            Pregunta {{ currentQuestionIndex + 1 }} de {{ questionsTrivia.length }}
          </p>
          <!-- <div class="flex space-x-2 items-center text-gray-600">
            <span>Saber mas</span>
            <p class="p-1 px-3 text-center text-gray-50 rounded-full bg-gray-500">
            ?
            </p>
          </div> -->
      </div>
        <h6 class="text-3xl md:text-2xl font-semibold py-3 text-gray-700 text-center" >
         {{ currentQuestion.question }}
        </h6>

        <div class="my-4">
          <div class="grid grid-cols-2 md:grid-cols-2 gap-2">
            <button class="rounded-lg px-4 py-2 items-center w-full h-24 overflow-y-auto bg-sky-400 text-gray-50 text-lg cursor-pointer hover:scale-105 duration-100"
              *ngFor="let option of currentQuestion.options; index as i"
              (click)="selectOption(i)"
              [ngClass]="{
                'bg-green-400 animate-correct': showAnswerFeedback && isCorrectAnswer && selectedOptionIndex === i,
                'bg-red-400 animate-wrong': showAnswerFeedback && !isCorrectAnswer && selectedOptionIndex === i,
                'bg-sky-400': !showAnswerFeedback
              }"
            [disabled]="showAnswerFeedback"
            >
              {{ option.option }}
            </button>
          </div>
        </div>
        <div class="px-4 py-2">
          <div class="relative w-full h-6 bg-gray-300 rounded-full overflow-hidden"> 
            <div 
              class="h-full bg-green-500 text-xs text-gray-50 text-center flex items-center justify-center transition-all duration-300 ease-in-out"
              [style.width.%]="(score / questionsTrivia.length) * 100">
              {{ score }} / {{ questionsTrivia.length }}
            </div>
          </div>
        </div>
      </div>


    <!-- <div class="mt-10 px-3">
     <p>Más juegos</p>
         <div class="mt-2 flex flex-col md:flex-row gap-4 justify-center items-center">
          <button class="rounded-xl px-4 py-2 items-center w-80 h-[100px] bg-green-400 text-gray-50 text-xl cursor-pointer hover:scale-105 duration-100"
         (click) = "goToBreed()"
         >
           🧐 Adivina la raza
          </button>
          <button class="rounded-xl px-4 py-2 items-center w-80 h-[100px] bg-green-400 text-gray-50 text-xl cursor-pointer hover:scale-105 duration-100"
         (click) = "goToQuiz()"
          >
            🧠 Prueba tu conocimiento
          </button>
      
    </div>
   </div> -->
  </section>

        <!-- modal de Resultado -->
      <div *ngIf="showFinalResult" class="animate-fade-in absolute top-10 inset-0 w-full h-full bg-gray-50 rounded-lg text-center p-4 mt-10">
        <h2 class="text-2xl font-bold text-sky-600 mb-4">Resultado Final</h2>
        <img *ngIf="finalGif" [src]="finalGif" alt="Resultado" class="mx-auto rounded-xl mt-4 w-48 h-48 object-cover shadow-lg mb-2" />
        <p class="text-xl mb-2 mt-1">{{ finalMessage }}</p>
        <p class="text-lg text-gray-700 mb-4">Puntaje: {{ score }} / {{ questionsTrivia.length }}</p>
        <button (click)="restartQuiz()" class="bg-sky-500 hover:bg-sky-600 text-white py-2 px-6 rounded-xl mt-4">
          Volver a Intentar
        </button>
      </div>


</ion-content>
