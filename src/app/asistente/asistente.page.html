<ion-header class="bg-white shadow-none border-b border-gray-200">
  <a href="/" class="flex gap-2 items-center mx-3 my-2">
    <img 
      class="max-h-14 mx-auto"
      alt="logo PetPalooza" 
      src="assets/img/logo/PetPalooza.png" 
    />
  </a>
</ion-header>

<ion-content [fullscreen]="true" class="asistente-content" [scrollY]="false">
  <div class="iframe-wrapper" lang="es">
    <div class="loading-overlay" *ngIf="isLoading">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Cargando asistente veterinario...</p>
    </div>
    
    <iframe
      [src]="chatUrl"
      class="chat-frame"
      allow="clipboard-write; microphone; camera; autoplay; encrypted-media; fullscreen; web-share"
      title="Asistente Veterinario IA en Español"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation-by-user-activation allow-pointer-lock allow-downloads allow-modals"
      (load)="onIframeLoad()"
      loading="eager"
      lang="es"
      data-language="es"
      data-locale="es-ES"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>
</ion-content>
