<ion-header class="bg-white shadow-none border-b border-gray-200">
  <div class="flex gap-2 items-center mx-3 my-2">
    <img 
      class="max-h-14 mx-auto"
      alt="logo PetPalooza" 
      src="assets/img/logo/PetPalooza.png" 
    />
  </div>
</ion-header>

<ion-content [fullscreen]="true" class="bg-gray-50">
  <section class="max-w-md w-full mx-auto">    
      <div class="w-full max-w-[570px] rounded-[20px] px-8 pt-4 text-center">
        <h1 class="pb-2 text-3xl font-medium">Trivia </h1>
        <span class="bg-blue-400 mx-auto mb-4 inline-block h-1 w-[90px] rounded"></span>
      </div>
    </section>
  <div *ngIf="currentQuestion" class="p-4" >
    <h6 class="bg-gray-50 text-3xl font-semibold py-3 text-black text-center" >
      <ion-card-title>{{ currentQuestion.question }}</ion-card-title>
    </h6>

    <div class="bg-gray-50 my-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 ">
        <button class="rounded-xl px-4 py-2 items-center w-96 bg-amber-300 text-gray-50 cursor-pointer hover:scale-105 duration-100"
          *ngFor="let option of currentQuestion.options; index as i"
          (click)="selectOption(i)"
          [class.correct]="showAnswerFeedback && i === currentQuestion.correct"
          [class.wrong]="showAnswerFeedback && i === selectedOptionIndex && i !== currentQuestion.correct"
        >
          {{ option.option }}
        </button>
      </div>
    </div>
  </div>

<ion-text class="ion-padding">
  Pregunta {{ currentQuestionIndex + 1 }} de {{ questionsTrivia.length }}
</ion-text>

</ion-content>
